AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  PotAI - backend IoT fim a fim (base A11). Cria DynamoDB (lecturas y riegos),
  dos Lambdas (codigo en un bucket S3), dos IoT Rules, HTTP API e IAM minimo.
  Nao hospeda o cliente Web nem o app.

Parameters:
  TableName:
    Type: String
    Default: PSI3542Telemetry
  IrrigationTableName:
    Type: String
    Default: PSI3542Irrigation
  IoTRuleName:
    Type: String
    Default: psi3542_a11_telemetry_ingest
    AllowedPattern: '^[a-zA-Z0-9_]+$'
  IrrigationRuleName:
    Type: String
    Default: psi3542_potai_irrigation_ingest
    AllowedPattern: '^[a-zA-Z0-9_]+$'
  IotDataEndpoint:
    Type: String
    Description: 'Endpoint HTTPS do AWS IoT Data-ATS, incluindo https://'
  ClientOrigin:
    Type: String
    Default: '*'
    Description: >-
      Origen permitido por CORS. Solo importa para clientes web (el app movil
      de PotAI no usa CORS). '*' sirve para desarrollo.
  CodeBucket:
    Type: String
    Description: 'Bucket S3 (misma Region) donde subio ingest.zip y api.zip'
  IngestCodeKey:
    Type: String
    Default: potai/ingest.zip
  ApiCodeKey:
    Type: String
    Default: potai/api.zip

Resources:
  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: thingName
          AttributeType: S
        - AttributeName: ingestionKey
          AttributeType: S
      KeySchema:
        - AttributeName: thingName
          KeyType: HASH
        - AttributeName: ingestionKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IrrigationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref IrrigationTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: thingName
          AttributeType: S
        - AttributeName: ingestionKey
          AttributeType: S
      KeySchema:
        - AttributeName: thingName
          KeyType: HASH
        - AttributeName: ingestionKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: psi3542-a11-ingest-ddb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt TelemetryTable.Arn
                  - !GetAtt IrrigationTable.Arn

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: psi3542-a11-api-ddb-iot
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !GetAtt TelemetryTable.Arn
                  - !GetAtt IrrigationTable.Arn
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/psi3542/*/command

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/psi3542-a11-ingest
      RetentionInDays: 7

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/psi3542-a11-api
      RetentionInDays: 7

  # El codigo vive en 02_cloud_aws/lambda_ingest y lambda_api. Se empaqueta con
  # `python build_backend_zip.py` y se sube a S3 (ver POTAI_BACKEND.md).
  IngestFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngestLogGroup
    Properties:
      FunctionName: psi3542-a11-ingest
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt IngestRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          IRRIGATION_TABLE_NAME: !Ref IrrigationTableName
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref IngestCodeKey

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: psi3542-a11-api
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          IRRIGATION_TABLE_NAME: !Ref IrrigationTableName
          IOT_DATA_ENDPOINT: !Ref IotDataEndpoint
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref ApiCodeKey

  IoTRuleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/${IoTRuleName}

  IrrigationRuleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/${IrrigationRuleName}

  TelemetryRule:
    Type: AWS::IoT::TopicRule
    DependsOn: IoTRuleInvokePermission
    Properties:
      RuleName: !Ref IoTRuleName
      TopicRulePayload:
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT *, topic(2) AS thingName, timestamp() AS ingested_at_ms,
          traceid() AS message_trace_id FROM 'psi3542/+/telemetry'
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn

  IrrigationRule:
    Type: AWS::IoT::TopicRule
    DependsOn: IrrigationRuleInvokePermission
    Properties:
      RuleName: !Ref IrrigationRuleName
      TopicRulePayload:
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT *, topic(2) AS thingName, timestamp() AS ingested_at_ms,
          traceid() AS message_trace_id, 'irrigation' AS record_type
          FROM 'psi3542/+/irrigation'
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IngestFunction.Arn

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: psi3542-a11-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref ClientOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 300

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000

  GetPlantsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'GET /plants'
      Target: !Join
        - /
        - - integrations
          - !Ref ApiIntegration

  GetDashboardRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'GET /devices/{thingName}/dashboard'
      Target: !Join
        - /
        - - integrations
          - !Ref ApiIntegration

  GetLatestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'GET /devices/{thingName}/telemetry/latest'
      Target: !Join
        - /
        - - integrations
          - !Ref ApiIntegration

  GetHistoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'GET /devices/{thingName}/telemetry/history'
      Target: !Join
        - /
        - - integrations
          - !Ref ApiIntegration

  GetIrrigationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'GET /devices/{thingName}/irrigations'
      Target: !Join
        - /
        - - integrations
          - !Ref ApiIntegration

  PostCommandRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: 'POST /devices/{thingName}/command'
      Target: !Join
        - /
        - - integrations
          - !Ref ApiIntegration

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  ApiBaseUrl:
    Description: URL base da HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TelemetryTableName:
    Value: !Ref TableName
  IrrigationTableName:
    Value: !Ref IrrigationTableName
  IngestFunctionName:
    Value: !Ref IngestFunction
  ApiFunctionName:
    Value: !Ref ApiFunction
  IoTRule:
    Value: !Ref TelemetryRule
  IrrigationRule:
    Value: !Ref IrrigationRule
